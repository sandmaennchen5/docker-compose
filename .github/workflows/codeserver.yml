name: "[Auto] Update & Build Code-Server"

on:
  schedule:
    - cron: "0 0/23 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "codeserver/**"
      - ".github/workflows/codeserver.yml"

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
      upstream_tag: ${{ steps.check.outputs.upstream_tag }}
      repo_tag: ${{ steps.check.outputs.repo_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check latest upstream version
        id: check
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_JSON="$(curl -fsSL 'https://api.github.com/repos/linuxserver/docker-code-server/releases/latest')"
          UPSTREAM_TAG="$(jq -r '.tag_name' <<< "${RELEASE_JSON}")"

          if [[ -z "${UPSTREAM_TAG}" || "${UPSTREAM_TAG}" == "null" ]]; then
            echo "::error::Unable to resolve LinuxServer code-server upstream tag"
            exit 1
          fi

          VERSION="${UPSTREAM_TAG%%-ls*}"
          REPO_TAG="code-server_${VERSION}"

          echo "Upstream tag: ${UPSTREAM_TAG}"
          echo "Version: ${VERSION}"
          echo "Repository tag: ${REPO_TAG}"

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "upstream_tag=${UPSTREAM_TAG}" >> "${GITHUB_OUTPUT}"
          echo "repo_tag=${REPO_TAG}" >> "${GITHUB_OUTPUT}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          LAST="none"

          if [[ -f codeserver/versions.yaml ]]; then
            LAST="$(
              awk -F': ' '
                /^upstream:/ { in_upstream=1; next }
                in_upstream && /^  version:/ {
                  gsub(/"/, "", $2)
                  print $2
                  exit
                }
              ' codeserver/versions.yaml
            )"
          elif [[ -f codeserver/upstream_version.txt ]]; then
            LAST="$(cat codeserver/upstream_version.txt)"
          fi

          [[ -n "${LAST}" ]] || LAST="none"

          echo "Last build: ${LAST}"

          if [[ "${VERSION}" != "${LAST}" ]]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          fi

  build:
    needs: check-upstream
    if: needs.check-upstream.outputs.changed == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve upstream digest
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          REF="lscr.io/linuxserver/code-server:${{ needs.check-upstream.outputs.upstream_tag }}"

          docker buildx imagetools inspect "${REF}"

          DIGEST="$(
            docker buildx imagetools inspect "${REF}"             | sed -n 's/^Digest:[[:space:]]*//p'             | head -n1
          )"

          [[ -n "${DIGEST}" ]]

          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Build and Push Image
        uses: docker/build-push-action@v7
        with:
          context: ./codeserver
          file: ./codeserver/Dockerfile
          push: true
          pull: true
          build-args: |
            CODE_SERVER_BASE=lscr.io/linuxserver/code-server:${{ needs.check-upstream.outputs.upstream_tag }}@${{ steps.upstream.outputs.digest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          tags: |
            ghcr.io/${{ github.repository }}/codeserver:latest
            ghcr.io/${{ github.repository }}/codeserver:${{ needs.check-upstream.outputs.version }}

      - name: Write codeserver/versions.yaml
        shell: bash
        env:
          VERSION: ${{ needs.check-upstream.outputs.version }}
          UPSTREAM_TAG: ${{ needs.check-upstream.outputs.upstream_tag }}
          REPO_TAG: ${{ needs.check-upstream.outputs.repo_tag }}
          UPSTREAM_DIGEST: ${{ steps.upstream.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}/codeserver
        run: |
          set -euo pipefail

          BUILD_DATE="$(date -u +'%Y.%m.%d')"

          cat > codeserver/versions.yaml <<EOF
          build:
            date: "${BUILD_DATE}"
            git_tag: "${REPO_TAG}"
            image: "${IMAGE}"
            image_tag: "${VERSION}"

          upstream:
            project: "linuxserver/docker-code-server"
            image: "lscr.io/linuxserver/code-server"
            version: "${VERSION}"
            tag: "${UPSTREAM_TAG}"
            ref: "lscr.io/linuxserver/code-server:${UPSTREAM_TAG}"
            digest: "${UPSTREAM_DIGEST}"
          EOF

      - name: Update codeserver/CHANGELOG.md
        shell: bash
        env:
          VERSION: ${{ needs.check-upstream.outputs.version }}
          UPSTREAM_TAG: ${{ needs.check-upstream.outputs.upstream_tag }}
        run: |
          set -euo pipefail

          BUILD_DATE="$(date -u +'%Y.%m.%d')"

          RELEASE_BODY="$(
            curl -fsSL 'https://api.github.com/repos/linuxserver/docker-code-server/releases/latest'             | jq -r --arg tag "${UPSTREAM_TAG}" '
                if .tag_name == $tag then (.body // "") else "" end
              '
          )"

          TMP="$(mktemp)"

          {
            echo "# Code-Server Changelog"
            echo
            echo "## ${VERSION} — ${BUILD_DATE}"
            echo
            echo "**Upstream:** \`linuxserver/docker-code-server:${UPSTREAM_TAG}\`"
            echo
            echo "### Upstream Changelog"
            echo

            if [[ -n "${RELEASE_BODY}" ]]; then
              echo "${RELEASE_BODY}"
            else
              echo "_Keine Upstream-Release-Notes vorhanden._"
            fi

            echo
          } > "${TMP}"

          if [[ -f codeserver/CHANGELOG.md ]]; then
            tail -n +2 codeserver/CHANGELOG.md >> "${TMP}"
          fi

          mv "${TMP}" codeserver/CHANGELOG.md

      - name: Commit version metadata
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add codeserver/versions.yaml codeserver/CHANGELOG.md

          if [[ -f codeserver/upstream_version.txt ]]; then
            git rm codeserver/upstream_version.txt
          fi

          if ! git diff --cached --quiet; then
            git commit -m "chore(code-server): ${{ needs.check-upstream.outputs.version }} [skip ci]"
            git push
          fi

      - name: Create repository tag
        shell: bash
        env:
          REPO_TAG: ${{ needs.check-upstream.outputs.repo_tag }}
        run: |
          set -euo pipefail

          git fetch --tags --force

          if git rev-parse "${REPO_TAG}" >/dev/null 2>&1; then
            echo "Repository tag ${REPO_TAG} already exists."
            exit 0
          fi

          git tag -a "${REPO_TAG}" -m "Code-Server ${{ needs.check-upstream.outputs.version }}"
          git push origin "${REPO_TAG}"
