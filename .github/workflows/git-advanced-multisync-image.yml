name: Build Git Advanced Multisync image

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Upstream branch, tag or commit to build
        required: true
        default: main
        type: string
  push:
    branches: [main]
    paths:
      - .github/workflows/git-advanced-multisync-image.yml
      - git-advanced-multisync/Dockerfile

permissions:
  contents: read

concurrency:
  group: git-advanced-multisync-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out image recipe
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out upstream source
        uses: actions/checkout@v4
        with:
          repository: DEC-LLC/git-advanced-multisync
          ref: ${{ inputs.upstream_ref || 'main' }}
          path: upstream
          persist-credentials: false

      - name: Determine image name and source revision
        id: image
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "name=ghcr.io/${OWNER,,}/git-advanced-multisync" >> "$GITHUB_OUTPUT"
          echo "revision=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for upstream updates
        id: updates
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          IMAGE: ${{ steps.image.outputs.name }}
          REVISION: ${{ steps.image.outputs.revision }}
        run: |
          set -euo pipefail
          rebuild=true
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            if docker buildx imagetools inspect "$IMAGE:sha-$REVISION" --raw > "$RUNNER_TEMP/multisync-revision.json" \
              && docker buildx imagetools inspect "$IMAGE:latest" --raw > "$RUNNER_TEMP/multisync-latest.json" \
              && cmp -s "$RUNNER_TEMP/multisync-revision.json" "$RUNNER_TEMP/multisync-latest.json"; then
              rebuild=false
            fi
          fi
          echo "rebuild=$rebuild" >> "$GITHUB_OUTPUT"
          if [[ "$rebuild" == "false" ]]; then
            echo "Upstream commit $REVISION is already published as latest." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Building upstream commit $REVISION." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build and publish image
        if: steps.updates.outputs.rebuild == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./upstream
          file: ./git-advanced-multisync/Dockerfile
          platforms: linux/amd64
          push: true
          pull: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ steps.image.outputs.revision }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
            org.opencontainers.image.url=https://github.com/DEC-LLC/git-advanced-multisync
          cache-from: type=gha
          cache-to: type=gha,mode=max
