name: Build GitMesh image

on:
  push:
    branches: [main]
    tags: ['gitmesh-v*']
    paths:
      - 'gitmesh/**'
      - '!gitmesh/versions.yaml'
      - '.github/workflows/gitmesh-image.yml'
  pull_request:
    paths:
      - 'gitmesh/**'
      - '!gitmesh/versions.yaml'
      - '.github/workflows/gitmesh-image.yml'
  workflow_dispatch:
  schedule:
    - cron: '43 4 * * 1'

permissions:
  contents: read

concurrency:
  group: gitmesh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r gitmesh/requirements.txt
      - name: Test GitMesh
        run: python -m unittest discover -s gitmesh/tests -v
      - name: Install browser test dependencies
        working-directory: gitmesh
        run: npm ci --ignore-scripts
      - name: Install Chromium
        working-directory: gitmesh
        run: npx playwright install --with-deps chromium
      - name: Test management UI
        working-directory: gitmesh
        run: npm run test:browser
      - name: Build Docker test image
        run: docker build -t gitmesh:codex-test gitmesh
      - name: Test separate Docker services
        run: python gitmesh/tests/docker-smoke.py

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Determine image name and tags
        id: image
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          REVISION: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          image="ghcr.io/${OWNER,,}/gitmesh"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<GITMESH_TAGS'
            echo "$image:sha-$REVISION"
            if [[ "$REF_TYPE" == "branch" && "$REF_NAME" == "$DEFAULT_BRANCH" ]]; then
              echo "$image:latest"
            fi
            if [[ "$REF_TYPE" == "tag" ]]; then
              echo "$image:${REF_NAME#gitmesh-}"
            fi
            echo 'GITMESH_TAGS'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./gitmesh
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=GitMesh
          cache-from: type=gha,scope=gitmesh
          cache-to: type=gha,mode=max,scope=gitmesh

  versions:
    name: Document installed image versions
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read versions from published images and write gitmesh/versions.yaml
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          DIGEST: ${{ needs.image.outputs.digest }}
          REVISION: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python gitmesh/version_report.py --image "$IMAGE" --digest "$DIGEST" --revision "$REVISION" --ref "$REF_NAME"
          cat gitmesh/versions.yaml
      - name: Upload version report
        uses: actions/upload-artifact@v7
        with:
          name: gitmesh-versions-${{ github.run_id }}
          path: gitmesh/versions.yaml
      - name: Commit versions.yaml on the default branch
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_REVISION: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote origin "refs/heads/$DEFAULT_BRANCH" | cut -f1)"
          if [[ "$current" != "$SOURCE_REVISION" ]]; then
            echo 'Branch advanced during build; report remains available as an artifact.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gitmesh/versions.yaml
          if ! git diff --cached --quiet; then
            git commit -m 'chore(gitmesh): document image versions [skip ci]'
            git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
          fi
