name: Build GitMesh image

on:
  push:
    branches: [main]
    tags: ['gitmesh-v*']
    paths:
      - 'gitmesh/**'
      - '.github/workflows/gitmesh-image.yml'
  pull_request:
    paths:
      - 'gitmesh/**'
      - '.github/workflows/gitmesh-image.yml'
  workflow_dispatch:
  schedule:
    - cron: '43 4 * * 1'

permissions:
  contents: read

concurrency:
  group: gitmesh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Test GitMesh
        run: python -m unittest discover -s gitmesh/tests -v

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Determine image name and tags
        id: image
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          REVISION: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          image="ghcr.io/${OWNER,,}/gitmesh"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<GITMESH_TAGS'
            echo "$image:sha-$REVISION"
            if [[ "$REF_TYPE" == "branch" && "$REF_NAME" == "$DEFAULT_BRANCH" ]]; then
              echo "$image:latest"
            fi
            if [[ "$REF_TYPE" == "tag" ]]; then
              echo "$image:${REF_NAME#gitmesh-}"
            fi
            echo 'GITMESH_TAGS'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: ./gitmesh
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=GitMesh
          cache-from: type=gha,scope=gitmesh
          cache-to: type=gha,mode=max,scope=gitmesh
